name: Bump version

on:
  push:
    branches: [main]

jobs:
  bump-version:
    if: "!contains(github.event.head_commit.message, '[skip build-bump]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump patch version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version patch --no-git-tag-version

      - name: Update README and index.html version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/Version: [0-9]*\.[0-9]*\.[0-9]*/Version: $VERSION/" README.md
          sed -i "s/<h2 id=\"version\">.*<\/h2>/<h2 id=\"version\">v$VERSION<\/h2>/" index.html
          git add package.json README.md index.html
          git commit -m "chore: bump version to $VERSION [skip build-bump]"

      - name: Push changes
        run: git push
