# .github/workflows/bump-build-number.yml
name: Bump build number

on:
  push:
    branches: [main]

jobs:
  bump-build:
    if: "!contains(github.event.head_commit.message, '[skip build-bump]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump buildNumber in package.json
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json'));
            pkg.buildNumber = (pkg.buildNumber || 0) + 1;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump build number [skip build-bump]"
          git push
